<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP</title>
<link rel="stylesheet" href="assets/css/os.css">
<style>
  #desktop{background-image:url('assets/img/wp-snow.jpg');}
</style>
</head>
<body>

<div id="desktop"></div>

<div class="guest-strip" id="guest-strip">
  ⚠ 来宾账户 · 部分功能受限　|　当前可以查看：日历、最近使用的文档
</div>

<div id="taskbar">
  <div id="start-btn">🪟 开始</div>
  <div id="task-buttons"></div>
  <div id="tray"><span title="本地连接已断开">🔌</span><span>🔊</span><span id="clock">23:47</span></div>
</div>

<div id="start-menu">
  <div class="sm-header"><div class="avatar"></div><b id="sm-user">陈 默</b></div>
  <div style="display:flex;">
    <div class="sm-items" style="flex:1.2;" id="sm-left"></div>
    <div class="sm-items sm-right" style="flex:1;" id="sm-right"></div>
  </div>
  <div class="sm-footer"><span onclick="logout()" style="cursor:pointer;">🔒 注销(L)</span><span onclick="doShutdown()" style="cursor:pointer;">⏻ 关闭计算机(U)</span></div>
</div>

<div class="bsod" id="bsod"><b>A problem has been detected...</b>

JZFS_FILE_SYSTEM

Technical information:

*** STOP: 0x000000EF (0xC0000034, 0xF85FF120, 0x00000000)

卷 C:\ 上的文件系统出现异常，系统已将内存转储。
如果你第一次看到此屏幕，请重启计算机。
如果再次出现，请检查你最近是否动过不该动的东西。

—— 这不是真的蓝屏。这是这台电脑想给你看的记忆。</div>

<script src="assets/js/os.js"></script>
<script src="assets/js/data.js"></script>
<script>
/* ============ 初始化 ============ */
const IS_GUEST = location.search.includes('guest') || sessionStorage.getItem('lb_guest')==='1';
const DESK = document.getElementById('desktop');

window.addEventListener('DOMContentLoaded',()=>{
  Game.injectFx();
  buildDesktop();
  bindGlobal();
  document.getElementById('clock').textContent='23:47';
  document.getElementById('clock').title='系统时间停留在 2003-12-31 23:47';

  if(IS_GUEST){
    document.getElementById('guest-strip').classList.add('show');
    document.getElementById('sm-user').textContent='Guest';
    DESK.classList.add('guest-mode');
    setTimeout(()=>Game.monologue('来宾模式。大部分门都锁着……但也许，正需要这样慢慢看。',6000),900);
  }else{
    setTimeout(()=>{Game.balloon('江州邮局','您有 1 封未读邮件。双击桌面「江州邮局」查看。',8000);},2600);
    setTimeout(()=>Game.monologue('雪还在下。这台机器的主人，去哪儿了？',6000),1000);
  }
});

function logout(){ WM.closeAll(); Game.goto('login.html'); }
function doShutdown(){ Game.goto('shutdown.html'); }

/* ============ 桌面图标 ============ */
function buildDesktop(){
  const icons = IS_GUEST ? [
    {id:'calendar', icon:'📅', label:'日历', x:26,y:26},
    {id:'recent',   icon:'📂', label:'最近使用的文档', x:26,y:126},
    {id:'mydocs',   icon:'📁', label:'我的文档', x:26,y:226},
    {id:'mail',     icon:'📮', label:'江州邮局', x:26,y:326},
    {id:'ie',       icon:'🌐', label:'Internet Explorer', x:26,y:426},
    {id:'recycle',  icon:'🗑️', label:'回收站', x:26,y:526},
  ] : [
    {id:'mycomp', icon:'🖥️', label:'我的电脑', x:26,y:26},
    {id:'mydocs', icon:'📁', label:'我的文档', x:26,y:126},
    {id:'mail',   icon:'📮', label:'江州邮局', x:26,y:226},
    {id:'ie',     icon:'🌐', label:'Internet Explorer', x:26,y:326},
    {id:'notepad',icon:'📝', label:'记事本', x:26,y:426},
    {id:'recycle',icon:'🗑️', label:'回收站', x:26,y:526},
    {id:'media',  icon:'🎵', label:'媒体播放器', x:128,y:26},
  ];
  icons.forEach(cfg=>{
    const d=document.createElement('div');
    d.className='dicon';d.style.left=cfg.x+'px';d.style.top=cfg.y+'px';
    d.innerHTML='<div class="ico">'+cfg.icon+'</div><span class="lbl">'+cfg.label+'</span>';
    d.ondblclick=()=>openApp(cfg.id);
    d.onclick=e=>{document.querySelectorAll('.dicon').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');};
    d.oncontextmenu=e=>{
      e.preventDefault();
      WM.ctxMenu(e.clientX,e.clientY,[
        {label:'打开',fn:()=>openApp(cfg.id)},
        '-',
        {label:'属性',fn:()=>WM.dialog('ℹ️',(IS_GUEST)?'您没有足够的权限查看该项目。<br>请使用管理员账户登录。':'「'+cfg.label+'」<br>类型：系统对象<br>创建时间：2001-08-17')}
      ]);
    };
    DESK.appendChild(d);
  });

  DESK.oncontextmenu=e=>{
    if(e.target!==DESK)return;
    e.preventDefault();
    WM.ctxMenu(e.clientX,e.clientY,[
      {label:'刷新',fn:()=>{DESK.style.opacity=.6;setTimeout(()=>DESK.style.opacity=1,180);}},
      '-',
      {label:'属性',fn:()=>WM.dialog('🖥️','江州 Union P4X-400<br>Pentium(R) 4 2.40GHz<br>512 MB 内存<br><br>系统：Windows XP Professional（虚构致敬版）')}
    ]);
  };
}

function lockTip(){
  Sfx.errBeep();
  WM.dialog('🔒','该功能在<b>来宾账户</b>下不可用。<br><br>提示：主人的密码线索，也许就藏在你能打开的东西里。');
}

/* ============ 应用分发 ============ */
function openApp(id){
  try{Sfx.click();}catch(e){}
  const map={
    mycomp:()=>appMyComputer(),
    mydocs:()=>IS_GUEST?lockTip():appExplorer(),
    recycle:()=>IS_GUEST?lockTip():appRecycle(),
    mail:()=>IS_GUEST?lockTip():appMail(),
    ie:()=>IS_GUEST?lockTip():appIE(),
    notepad:()=>appNotepad(null),
    media:()=>appMedia(),
    calendar:()=>appCalendar(),
    recent:()=>appRecentDocs(),
  };
  (map[id]||(()=>{}))();
}

/* ============ 我的电脑 / 软盘 / C盘 ============ */
const TREE_ROOT=[
  {name:'本地磁盘 (C:)', icon:'💽', act:()=>appDriveC()},
  {name:'3.5 软盘 (A:)', icon:'💾', act:()=>Game.flag('floppy_in')?appFloppy():floppyPrompt()},
  {name:'CD 驱动器 (D:)', icon:'💿', act:()=>WM.dialog('💿','请插入光盘。')},
  {name:'我的文档', icon:'📁', act:()=>appExplorer()},
];
function appMyComputer(){
  const body=document.createElement('div');
  body.innerHTML='<div class="explorer"><div class="ex-side">'+
    '<div class="ex-panel"><h4>系统任务</h4><div>查看系统信息</div><div>添加/删除程序</div></div>'+
    '<div class="ex-panel"><h4>其它位置</h4><div onclick="openApp(\'mydocs\')">我的文档</div><div onclick="openApp(\'recycle\')">回收站</div></div>'+
    '</div><div class="ex-main"><div class="fgrid" id="mc-grid"></div></div></div>';
  WM.create({id:'mycomp',title:'我的电脑',icon:'🖥️',width:640,height:430,content:body});
  const g=body.querySelector('#mc-grid');
  TREE_ROOT.forEach(it=>{
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">'+it.icon+'</div><div class="fn">'+it.name+'</div>';
    f.ondblclick=it.act;
    g.appendChild(f);
  });
}
function floppyPrompt(){
  if(Game.flag('list_seen')){
    WM.dialog('💾','软盘驱动器 A: 中没有磁盘。<br><br>纸箱里那张标注 <b>ZY-0034</b> 的软盘，就在手边。',
      [{label:'插入软盘',value:1},{label:'取消',value:null}]
    ).then(v=>{
      if(v){
        Game.setFlag('floppy_in');
        Game.toast('咔哒。软盘已插入。');
        Game.Timeline.at(500,()=>appFloppy());
      }
    });
  }else{
    WM.dialog('💾','请将磁盘插入驱动器 A:。<br><br><span style="color:#666">（房东移交清单里提到过一张软盘……它此刻在哪里？）</span>');
  }
}
function appFloppy(){
  if(!Game.flag('floppy_in')){floppyPrompt();return;}
  const body=document.createElement('div');
  body.innerHTML='<div class="crumbbar">💾 3.5 软盘 (A:)</div><div class="fgrid" id="fl-grid" style="padding:10px;"></div>';
  WM.create({id:'a-drive',title:'3.5 软盘 (A:)',icon:'💾',width:520,height:340,content:body});
  const g=body.querySelector('#fl-grid');
  FLOPPY.files.forEach(f=>{
    const el=document.createElement('div');el.className='fitem';
    el.innerHTML='<div class="fi">'+(f.kind==='img'?'🖼️':'📃')+'</div><div class="fn">'+f.name+'</div>';
    el.ondblclick=()=>{
      if(f.kind==='txt'){appNotepad({title:f.name,text:f.body});markTransfer();}
      else viewImage(f.src,f.caption,'kword');
    };
    g.appendChild(el);
  });
  Game.monologue('软盘转动的声音很轻。四年前的雪夜，被抄在这一张小盘片上。',6000);
}
function markTransfer(){
  if(!Game.hasClue('transfer')){
    Game.mark('transfer');
    Game.monologue('第 03 行：陈小默……1996 年 6 月 1 日，周秀兰领养迁出。<br>这个名字后面，跟着他自己的人生。',9000);
  }
}
function appDriveC(){
  const body=document.createElement('div');
  body.innerHTML='<div class="crumbbar">💽 本地磁盘 (C:)</div><div class="fgrid" id="c-grid" style="padding:10px;"></div>';
  WM.create({id:'drive-c',title:'本地磁盘 (C:)',icon:'💽',width:560,height:360,content:body});
  const g=body.querySelector('#c-grid');
  [
    {n:'Documents and Settings',i:'📁',act:()=>WM.dialog('🔒','访问拒绝：这不是你的账户。')},
    {n:'Program Files',i:'📁',act:()=>appFolderGeneric('Program Files',['Internet Explorer','江州邮局','易聊 2003','Media Player','搜霸助手'])},
    {n:'WINDOWS',i:'📁',act:()=>appFolderGeneric('WINDOWS',['system32','Fonts','Web'])},
    {n:'系统备份_勿动',i:'⚠️',act:()=>triggerBsod()},
  ].forEach(it=>{
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">'+it.i+'</div><div class="fn">'+it.n+'</div>';f.ondblclick=it.act;g.appendChild(f);
  });
  const used=document.createElement('div');used.style.cssText='padding:8px 12px;color:#666;width:100%;';
  used.innerHTML='<hr style="border:none;border-top:1px solid #ddd;margin-bottom:8px;">容量：40.0 GB　可用：21.3 GB';
  g.appendChild(used);
}
function appFolderGeneric(title,items){
  const body=document.createElement('div');
  body.innerHTML='<div class="crumbbar">📁 '+title+'</div><div class="fgrid" id="fg" style="padding:10px;"></div>';
  WM.create({id:'folder-'+title,title:title,icon:'📁',width:480,height:320,content:body});
  const g=body.querySelector('#fg');
  items.forEach(n=>{
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">📄</div><div class="fn">'+n+'</div>';
    f.ondblclick=()=>WM.dialog('ℹ️','无法打开「'+n+'」。<br>该文件与当前剧情无关。');
    g.appendChild(f);
  });
}
function triggerBsod(){
  const b=document.getElementById('bsod');
  b.classList.add('show');try{Sfx.errBeep();}catch(e){}
  Game.Timeline.at(3000,()=>{
    b.classList.remove('show');
    WM.dialog('😅','……吓到了吗？只是个玩笑。<br>不过说真的，「系统备份」里什么都没有。');
  });
  Game.setFlag('bsod_seen');
}

/* ============ 文档浏览器 ============ */
function docTree(){
  return {
    folders:{
      '稿件':{docs:['稿件/蓝星养育园调查_未完稿.doc','稿件/K会计采访录音_转写.txt']},
      '日记':{docs:['日记/2003-11-02.txt','日记/2003-11-20.txt','日记/2003-12-08.txt','日记/2003-12-24.txt','日记/2003-12-31.txt']},
      '扫描件':{docs:['扫描件/工作证扫描.jpg','扫描件/物品移交清单.jpg','扫描件/备案档案_LX-1998-117.jpg']},
      '照片':{docs:['照片/1996年六一合影.jpg','照片/养育园旧址_1998.jpg']},
      '_root':{docs:['给妈妈的信_未寄出.txt']}
    }
  };
}
function appExplorer(){
  const t=docTree();
  const body=document.createElement('div');
  body.innerHTML='<div class="toolbar"><span class="tbtn">⬅ 向上</span><span class="tbtn">🔍 搜索</span></div>'+
    '<div class="crumbbar">📁 我的文档</div>'+
    '<div class="explorer" style="height:calc(100% - 60px);"><div class="ex-main"><div class="fgrid" id="exp-grid"></div></div></div>';
  WM.create({id:'exp-mydocs',title:'我的文档 - 资源管理器',icon:'📁',width:620,height:420,content:body});
  const g=body.querySelector('#exp-grid');
  Object.keys(t.folders).forEach(fn=>{
    if(fn==='_root')return;
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">📁</div><div class="fn">'+fn+'</div>';
    f.ondblclick=()=>appSubFolder(fn);
    g.appendChild(f);
  });
  t.folders['_root'].docs.forEach(openDocItem(g));
}
function appSubFolder(folder){
  const docs=docTree().folders[folder].docs;
  const body=document.createElement('div');
  body.innerHTML='<div class="toolbar"><span class="tbtn" onclick="openApp(\'mydocs\')">⬅ 向上</span></div>'+
    '<div class="crumbbar">📁 我的文档 \\ '+folder+'</div>'+
    '<div class="fgrid" id="sf-grid" style="padding:10px;"></div>';
  WM.create({id:'sub-'+folder,title:folder,icon:'📁',width:600,height:400,content:body});
  const g=body.querySelector('#sf-grid');
  docs.forEach(openDocItem(g));
}
function openDocItem(grid){
  return key=>{
    const doc=DOCS[key];if(!doc)return;
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">'+doc.icon+'</div><div class="fn">'+doc.title+'</div>';
    f.ondblclick=()=>openDoc(key);
    grid.appendChild(f);
  };
}
function openDoc(key){
  const doc=DOCS[key];
  checkClueFromDoc(key);
  if(doc.kind==='img'){viewImage(doc.src,doc.caption,imgClueFor(key));return;}
  if(key==='给妈妈的信_未寄出.txt'){
    appNotepad({title:doc.title,text:plainOf(doc.body)});
    if(!Game.flag('letter_read')){
      Game.setFlag('letter_read');
      Game.monologue('「您把我从蓝星接回家的那天」……信封上的地址是临江区梧桐里 12 号。<br>这封信写好了，却一直没敢寄。',9000);
    }
    return;
  }
  if(doc.kind==='doc'){
    const body=document.createElement('div');
    body.innerHTML='<div class="toolbar"><span>文件(F)</span><span>编辑(E)</span><span>视图(V)</span><span>插入(I)</span><span>格式(O)</span><span style="margin-left:auto;color:#888;">Word 2003 · 只读</span></div>'+
      '<div style="overflow:auto;background:#808080;height:calc(100% - 30px);"><div class="doc-paper">'+doc.body+'</div></div>';
    WM.create({id:'doc-'+key.replace(/\W/g,''),title:doc.title+' - Word',icon:'📄',width:780,height:520,content:body});
  }else{
    appNotepad({title:doc.title,text:plainOf(doc.body)});
  }
}
function imgClueFor(key){
  if(key==='扫描件/备案档案_LX-1998-117.jpg')return'record';
  if(key==='扫描件/物品移交清单.jpg')return'list';
  if(key==='照片/养育园旧址_1998.jpg')return'photo';
  return null;
}
function plainOf(html){
  const d=document.createElement('div');d.innerHTML=html;
  return d.textContent.replace(/\n{3,}/g,'\n\n');
}
function checkClueFromDoc(key){
  if(key==='稿件/蓝星养育园调查_未完稿.doc'){
    Game.balloon('证据清单','稿子里列着 6 项证据。打勾的是他已取得的，空着的正是你要找的。',9000);
  }
  if(key==='稿件/K会计采访录音_转写.txt'){
    Game.mark('tape');
    setTimeout(()=>{if(Game.hasClue('tape'))Game.monologue('K 说：「蓝星的账，不能烂在雪地里。」',7000);},600);
  }
  if(key==='日记/2003-12-31.txt'){
    Game.setFlag('diary_final_read');
    if(Game.flag('letter_read'))Game.setFlag('ending_c_unlocked');
    Game.monologue('「剩下的，拜托你了。」——原来他早知道会有别人打开这台电脑。',9000);
  }
  if(key==='日记/2003-12-08.txt'||key==='日记/2003-12-24.txt'){
    Game.monologue('他查的是别人的案子，翻出来的却是自己的名字。',7000);
  }
}

/* 图片查看 */
function viewImage(src,caption,clue){
  const body=document.createElement('div');
  body.className='imgview-wrap';
  body.style.position='relative';
  body.innerHTML='<img src="'+src+'"><div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ddd;font-size:13px;text-shadow:0 1px 4px #000;line-height:1.9;">'+caption+'</div>';
  WM.create({id:'imgv-'+Date.now(),title:'图片查看器',icon:'🖼️',width:660,height:500,content:body});
  if(clue==='record'){Game.mark('record');Game.monologue('备案编号 LX-1998-117……记住它的末三位：117。',8000);}
  if(clue==='photo'){Game.mark('photo');}
  if(clue==='kword'){Game.mark('kword');}
  if(clue==='transfer'){markTransfer();}
  if(clue==='list'){
    Game.setFlag('list_seen');
    Game.monologue('移交清单上写着：一张软盘，标注 ZY-0034……它就在房东给的纸箱里。<br>下次打开「我的电脑」，把软盘插进 A 驱吧。',10000);
  }
  if(clue==='ledger'){Game.mark('ledger');}
}

/* ============ 记事本 / 最近文档 / 日历 ============ */
function appNotepad(preset){
  const ta=document.createElement('textarea');
  ta.className='notepad-area';ta.readOnly=true;
  ta.value=preset?preset.text:'记事本\r\n\r\n（空白。也许主人习惯把东西都放进文件夹里。）';
  WM.create({id:'np-'+(preset?preset.title.replace(/\W/g,''):'blank'),title:(preset?preset.title+' - 记事本':'无标题 - 记事本'),icon:'📝',width:600,height:430,content:ta});
}
function appRecentDocs(){
  const body=document.createElement('div');
  body.innerHTML='<div class="crumbbar">📂 最近使用的文档'+(IS_GUEST?'（Guest 可见 1 项）':'')+'</div><div class="fgrid" id="rd-grid" style="padding:10px;"></div>';
  WM.create({id:'recent-docs',title:'最近使用的文档',icon:'📂',width:520,height:330,content:body});
  const g=body.querySelector('#rd-grid');
  const items=[{key:'给妈妈的信_未寄出.txt'}];
  if(!IS_GUEST){
    items.unshift({key:'日记/2003-12-31.txt'},{key:'稿件/蓝星养育园调查_未完稿.doc'});
  }
  items.forEach(it=>{
    const doc=DOCS[it.key];
    const f=document.createElement('div');f.className='fitem';
    f.innerHTML='<div class="fi">'+doc.icon+'</div><div class="fn">'+doc.title+'</div>';
    f.ondblclick=()=>openDoc(it.key);
    g.appendChild(f);
  });
}
function appCalendar(){
  const y=1996,m=5;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  let html='<div style="text-align:center;font-size:15px;font-weight:bold;padding:10px 0;color:#123a8c;">1996年 六月</div><table style="width:100%;border-collapse:collapse;font-size:12px;">';
  html+='<tr>'+'日一二三四五六'.split('').map(d=>'<th style="padding:4px;color:#555;border-bottom:1px solid #ddd;">'+d+'</th>').join('')+'</tr><tr>';
  for(let i=0;i<first;i++)html+='<td></td>';
  for(let d=1;d<=days;d++){
    const mark=(d===1);
    html+='<td style="text-align:center;padding:5px;border:1px solid #eee;'+(mark?'background:#fff3bf;color:#8a1f11;font-weight:bold;':'')+'" '+(mark?'title="妈妈把我接回家"':'')+'>'+d+(mark?'<div style="font-size:9px;">🏠</div>':'')+'</td>';
    if((first+d)%7===0&&d<days)html+='</tr><tr>';
  }
  html+='</tr></table><div style="padding:10px;color:#8a1f11;font-size:12px;">📌 6月1日：妈妈把我接回家（这一天被红笔圈了很多年）</div>';

/* ============ IE 浏览器 ============ */
let NET_OK=false;
let historyStack=[],historyIdx=-1;
function appIE(home){
  if(!NET_OK){dialupFlow().then(ok=>{if(ok){NET_OK=true;renderIE(home||'sites/soba.html');}});return;}
  renderIE(home||'sites/soba.html');
}
function dialupFlow(){
  return new Promise(res=>{
    const mask=document.createElement('div');mask.className='dialog-mask';
    const d=document.createElement('div');d.className='xp-dialog';
    d.style.left='50%';d.style.top='36%';d.style.transform='translate(-50%,-50%)';
    d.innerHTML='<div class="titlebar"><span class="t-ico">📞</span><span class="t-text">连接到 96163</span><div class="t-btns"><div class="tb close">r</div></div></div>'+
      '<div class="dlg-body"><span class="dlg-icon">☎️</span><span>正在拨号：<b>96163（主叫计费接入号）</b><br>用户名：jz_chemo　密码：••••••••<br><span id="dial-status" style="color:#555;">正在初始化调制解调器…</span><br><span style="color:#999;font-size:11px;">（把声音开大一点，听听 2003 年的声音）</span></span></div>';
    DESK.appendChild(mask);DESK.appendChild(d);
    const st=d.querySelector('#dial-status');
    Sfx.ensure();
    let total=6500;
    try{total=(Sfx.dialup()||6.5)*1000;}catch(e){}
    st.textContent='正在拨号…';
    Game.Timeline.at(1900,()=>st.textContent='正在验证用户名和密码…');
    Game.Timeline.at(total*0.62,()=>st.textContent='正在网络上注册您的计算机…');
    Game.Timeline.at(total*0.85,()=>st.textContent='已连接（56.6 Kbps）✓');
    Game.Timeline.at(total+400,()=>{mask.remove();d.remove();res(true);});
    d.querySelector('.close').onclick=()=>{mask.remove();d.remove();res(false);};
  });
}
function renderIE(url){
  const body=document.createElement('div');
  body.innerHTML='<div class="ie-app">'+
    '<div class="ie-menu">文件(F) 编辑(E) 查看(V) 收藏(A) 工具(T) 帮助(H)</div>'+
    '<div class="ie-bar">'+
      '<span class="tbtn" data-role="back">◀ 后退</span>'+
      '<span class="tbtn" data-role="fw">前进 ▶</span>'+
      '<div class="ie-url"><span>🔗</span><span id="ie-cur-url" style="flex:1;">http://www.soba.com.cn</span><span id="ie-refresh" style="cursor:pointer;">⟳</span></div>'+
      '<button class="xp-button" id="ie-home" style="min-width:52px;">主页</button>'+
    '</div>'+
    '<iframe class="ie-frame" id="ie-frame" src="'+url+'"></iframe>'+
    '<div class="ie-status"><span id="ie-msg">完成</span><div class="ie-progress"><i id="ie-pg"></i></div></div>'+
    '</div>';
  const w=WM.create({id:'ie-window',title:'搜霸一下，你就知道 - Internet Explorer',icon:'🌐',width:900,height:600,content:body});
  w.el.querySelector('.win-body').style.overflow='hidden';
  historyStack=[url];historyIdx=0;
  wireIE(body,url);
}
function wireIE(root,firstUrl){
  const f=root.querySelector('#ie-frame');
  f.addEventListener('load',()=>{
    const pg=root.querySelector('#ie-pg'),msg=root.querySelector('#ie-msg');
    if(pg){pg.style.width='100%';setTimeout(()=>pg.style.width='0%',450);}
    if(msg)msg.textContent='完成';
    try{
      const cu=document.getElementById('ie-cur-url');
      if(cu)cu.textContent=f.contentDocument.getElementById('fake-url')?.textContent||cu.textContent;
    }catch(e){}
  });
  root.querySelector('[data-role=back]').onclick=e=>{e.stopPropagation();if(historyIdx>0){historyIdx--;frameLoad(root,historyStack[historyIdx]);}};
  root.querySelector('[data-role=fw]').onclick=e=>{e.stopPropagation();if(historyIdx<historyStack.length-1){historyIdx++;frameLoad(root,historyStack[historyIdx]);}};
  root.querySelector('#ie-refresh').onclick=()=>frameLoad(root,historyStack[historyIdx]);
  root.querySelector('#ie-home').onclick=()=>navigateIE(root,'sites/soba.html');
}
function frameLoad(root,url){
  const f=root.querySelector('#ie-frame');
  const pg=root.querySelector('#ie-pg'),msg=root.querySelector('#ie-msg');
  if(pg){pg.style.width='20%';}
  if(msg)msg.textContent='正在打开页面…';
  f.src=url;
  const cu=document.getElementById('ie-cur-url');
  if(cu)cu.textContent=prettyUrl(url);
  const w=WM.wins['ie-window'];
  if(w)setTimeout(()=>{try{w.el.querySelector('.t-text').textContent=(f.contentDocument.title||'页面')+' - Microsoft Internet Explorer';}catch(e){}},700);
}
function navigateIE(root,url){
  historyStack=historyStack.slice(0,historyIdx+1);historyStack.push(url);historyIdx++;
  frameLoad(root,url);
}
function prettyUrl(u){return u.replace(/^sites\//,'www.').replace('.html','')+'.com.cn/' + (u.includes('?')?u.split('?')[1]:'');}
window.ieNavigate=function(url){const root=Object.values(WM.wins).find(x=>x.el.querySelector('#ie-frame'));if(root)navigateIE(root.el,url);};
