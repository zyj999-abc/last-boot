<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows XP - 登录</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,"Microsoft YaHei",sans-serif;}
  body{height:100vh;overflow:hidden;background:#5a7edc url('assets/img/img-crt.jpg') no-repeat center/cover;position:relative;}
  body::before{content:'';position:absolute;inset:0;background:rgba(20,40,90,.45);}
  .bar{position:absolute;left:0;right:0;height:78px;background:linear-gradient(#003399,#0055d4);z-index:10;}
  .bar.top{top:0;border-bottom:2px solid #ff9900;} .bar.bot{bottom:0;border-top:2px solid #ff9900;}
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;width:min(760px,94vw);
    background:rgba(90,126,220,.35);border-radius:12px;backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:30px 0;}
  .divider{width:2px;height:240px;background:linear-gradient(transparent,#fff,transparent);margin:0 clamp(14px,4vw,44px);}
  .left{text-align:right;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.7);}
  .left h1{font-size:clamp(24px,4vw,34px);font-weight:normal;font-style:italic;}
  .left p{margin-top:8px;font-size:13px;}
  .right{display:flex;gap:14px;align-items:flex-start;}
  .avatar{width:64px;height:64px;border:2px solid #fff;border-radius:6px;
    background:linear-gradient(45deg,#dcd7c8,#b8b2a2);display:flex;align-items:flex-end;justify-content:center;font-size:38px;}
  .uname{color:#fff;font-size:21px;font-weight:bold;margin-bottom:8px;text-shadow:1px 1px 3px #000;}
  .pwdrow{display:flex;align-items:center;gap:5px;}
  .pwd{width:170px;height:28px;border:2px solid #99b4d1;border-radius:3px;padding:0 6px;outline:none;font-size:13px;-webkit-text-security:disc;}
  .pwd:focus{border-color:#0055d4;}
  .go{width:28px;height:28px;border-radius:4px;border:1px solid #fff;color:#fff;font-weight:bold;cursor:pointer;
    background:linear-gradient(#4cb849,#388e35);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .hint{margin-top:10px;color:#ffe9b8;font-size:12px;text-shadow:1px 1px 2px #000;}
  .err{margin-top:5px;color:#ffb3ab;font-size:12px;font-weight:bold;visibility:hidden;text-shadow:1px 1px 2px #000;}
  .guestline{margin-top:14px;font-size:12px;}
  .guestline a{color:#dbe8ff;cursor:pointer;text-decoration:underline;}
  /* 显示器边框便签 */
  .sticky{
    position:absolute;z-index:12;right:max(12px,4vw);top:96px;width:172px;padding:12px 13px;
    background:rgba(255,248,205,.92);color:#5d4037;font-family:"KaiTi","楷体",serif;
    font-size:14px;line-height:1.8;transform:rotate(-3deg);border-radius:2px;
    box-shadow:3px 5px 14px rgba(0,0,0,.4), inset 0 0 18px rgba(255,220,130,.35);
  }
  .sticky small{display:block;margin-top:6px;color:#999;font-style:italic;font-size:11px;}
  /* 欢迎层 */
  #welcome{position:absolute;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#5a7edc,#003399);color:#fff;}
  #welcome h2{font-size:26px;font-weight:normal;letter-spacing:2px;text-shadow:1px 1px 4px #000;}
  #welcome p{margin-top:14px;font-size:14px;opacity:.85;animation:pulse 1.2s infinite;}
  @keyframes pulse{50%{opacity:.4}}
</style>
</head>
<body>

<div class="bar top"></div>

<div class="sticky">
  默：<br>密码别再用<br>「咱仨相遇」的<br>日子了，换不换？<br><small>——夹在显示器边框上的便签</small>
</div>

<div class="center">
  <div class="left"><h1>Windows<span style="font-size:.55em;vertical-align:super;">®</span> xp</h1><p>要开始，请单击您的用户名</p></div>
  <div class="divider"></div>
  <div class="right">
    <div class="avatar">👤</div>
    <div>
      <div class="uname">陈 默</div>
      <div class="pwdrow">
        <input class="pwd" id="pwd" maxlength="10" placeholder="输入密码" autocomplete="off">
        <button class="go" onclick="tryLogin()">➔</button>
      </div>
      <div class="err" id="err">密码不正确。请再试一次。</div>
      <div class="hint">密码提示：一串数字。它藏在某个"相遇"里。</div>
      <div class="guestline">忘了密码？<a onclick="guestLogin()">以来宾身份（Guest）先看看</a></div>
    </div>
  </div>
</div>

<div class="bar bot"></div>

<div id="welcome"><h2 id="wtxt">欢迎</h2><p id="wsub">正在加载个人设置…</p></div>

<script src="assets/js/os.js"></script>
<script>
function tryLogin(){
  const v=document.getElementById('pwd').value.trim();
  if(!v){document.getElementById('err').style.visibility='visible';return;}
  Game.verify(v,'admin',()=>{
    document.getElementById('err').style.visibility='hidden';
    enter(true);
  },n=>{
    document.getElementById('err').style.visibility='visible';
    document.getElementById('pwd').value='';document.getElementById('pwd').focus();
    try{Sfx.errBeep();}catch(e){}
  });
}
function guestLogin(){
  sessionStorage.setItem('lb_guest','1');
  location.href='desktop.html?mode=guest';
}
function enter(admin){
  sessionStorage.removeItem('lb_guest');
  const w=document.getElementById('welcome');
  w.style.display='flex';w.style.opacity='0';w.style.transition='opacity .6s';
  requestAnimationFrame(()=>w.style.opacity='1');
  document.getElementById('wtxt').textContent=admin?'欢 迎':'正在注销 Guest…';
  document.getElementById('wsub').textContent=admin?'正在加载个人设置…':'正在加载受限的默认设置…';
  setTimeout(()=>location.href='desktop.html',2100);
}
document.getElementById('pwd').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
window.addEventListener('DOMContentLoaded',()=>document.getElementById('pwd').focus());
</script>
</body>
</html>
